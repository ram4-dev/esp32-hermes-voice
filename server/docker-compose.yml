services:
  bridge:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bridge-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bridge-data:
  caddy-data:
  caddy-config:
