name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: uv sync --locked --extra test
      - run: uv run ruff check voice_bridge tests
      - run: uv run pytest -q
      - run: docker build -t esp32-voice-bridge:ci .
      - name: Smoke test health endpoint
        run: |
          docker run -d --name voice-bridge-ci -p 8787:8787 \
            -e VOICE_DEVICE_TOKENS=device:test-token \
            -e STT_BASE_URL=https://stt.invalid \
            -e STT_API_KEY=test-stt-key \
            -e HERMES_BASE_URL=http://hermes.invalid:8642 \
            -e HERMES_API_KEY=test-hermes-key \
            -e TTS_BASE_URL=https://tts.invalid \
            -e TTS_API_KEY=test-tts-key \
            esp32-voice-bridge:ci
          trap 'docker rm -f voice-bridge-ci' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8787/health

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -e HOME=/tmp/idf-home
          -v "$PWD/firmware:/project"
          -w /project
          espressif/idf:v5.5.4
          bash -lc 'idf.py reconfigure && idf.py build'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
